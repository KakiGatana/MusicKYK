<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5ecdd" />
  <title>MusicKYK</title>
  <meta name="description" content="Intervalles : quiz et piano." />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" />
  <meta name="referrer" content="no-referrer" />
  <link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="update-bar" id="update-bar" role="status" hidden>
    <span>Nouvelle version en ligne.</span>
    <button type="button" id="btn-update">Actualiser</button>
    <button type="button" class="close" id="btn-update-close" aria-label="Fermer">×</button>
  </div>

  <div class="page">
    <header class="top">
      <h1 class="wordmark">MusicKYK</h1>
      <dl class="stats" aria-live="polite">
        <div><dt>Justes</dt><dd id="stat-score">0</dd></div>
        <div><dt>Réussite</dt><dd id="stat-acc">–</dd></div>
        <div><dt>Série</dt><dd id="stat-streak">0</dd></div>
      </dl>
    </header>
    <div class="staff" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

    <nav class="modes" aria-label="Mode de jeu">
      <button type="button" data-mode="note"><span class="n">1</span>Trouver la note</button>
      <button type="button" data-mode="name"><span class="n">2</span>Nommer l’intervalle</button>
      <button type="button" data-mode="ear"><span class="n">3</span>À l’oreille</button>
    </nav>

    <div class="dirs" role="group" aria-label="Sens des intervalles">
      <span class="lbl">Sens</span>
      <button type="button" data-dir="up">Montant</button>
      <button type="button" data-dir="down">Descendant</button>
      <button type="button" data-dir="both">Les deux</button>
    </div>

    <section class="question">
      <p class="qnum" id="q-eyebrow">01</p>
      <h2 id="question"></h2>
      <p class="feedback" id="feedback" role="status"></p>
      <div class="q-actions">
        <button class="btn" id="btn-next" type="button" disabled>Suivante</button>
        <button class="btn line" id="btn-listen" type="button"><span id="listen-label">Écouter</span></button>
      </div>
    </section>

    <section class="board" aria-label="Piano">
      <div class="piano" id="piano"></div>
      <div class="under">
        <p class="semis" id="semis"></p>
        <ul class="legend">
          <li><i class="sw root"></i>Départ</li>
          <li><i class="sw target"></i>Réponse</li>
          <li><i class="sw wrong"></i>Erreur</li>
        </ul>
      </div>
    </section>

    <section class="answers" aria-label="Réponses">
      <div class="answer-grid" id="answers"></div>
      <div class="answer-grid iv-grid" id="answers-iv" hidden></div>
    </section>

    <details class="fold">
      <summary><span>Réglages</span><small id="settings-summary"></small></summary>
      <div class="fold-body">
        <h3>Intervalles</h3>
        <div class="chips" id="chips-intervals"></div>
        <div class="row">
          <button class="link" type="button" data-preset="all">Tous</button>
          <button class="link" type="button" data-preset="asked">Sans les justes</button>
          <button class="link" type="button" data-preset="none">Aucun</button>
        </div>

        <h3>Notes de départ</h3>
        <div class="chips" id="chips-roots"></div>
        <div class="row">
          <button class="link" type="button" data-roots="all">Les 12</button>
          <button class="link" type="button" data-roots="white">Touches blanches</button>
        </div>

        <h3>Options</h3>
        <label class="check"><input type="checkbox" id="opt-sound" checked /><span></span>Son</label>
        <label class="check"><input type="checkbox" id="opt-auto" /><span></span>Passer à la suivante après une bonne réponse</label>
        <div class="row">
          <button class="link danger" type="button" id="btn-reset">Remettre les scores à zéro</button>
        </div>
      </div>
    </details>

    <details class="fold">
      <summary><span>Demi-tons</span><small>tableau</small></summary>
      <div class="fold-body"><table class="cheat" id="cheat"></table></div>
    </details>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
